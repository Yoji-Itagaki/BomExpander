# main への push と Pull Request のたびに、ビルドと単体テストを実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v5

      - name: .NET SDK を準備
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: ビルド
        run: dotnet build BomTool.sln -c Release

      - name: 単体テスト
        run: dotnet test BomTool.sln -c Release --no-build
