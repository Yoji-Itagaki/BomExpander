# v で始まるタグ（例：v1.0.0）を push すると、
# テスト → 自己完結型でビルド → zip 作成 → GitHub のリリース作成 までを自動で行う
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # リリースの作成に必要

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v5

      - name: .NET SDK を準備
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 単体テスト
        run: dotnet test BomTool.sln -c Release

      - name: 発行（.NET ランタイムを同梱した自己完結型）
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/BomTool.App/BomTool.App.vbproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o dist/BomTool

      - name: zip にまとめる（サンプルCSVと README も同梱）
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/BomTool/samples | Out-Null
          Copy-Item samples/*.csv dist/BomTool/samples/
          Copy-Item README.md dist/BomTool/
          Compress-Archive -Path dist/BomTool -DestinationPath "dist/BomTool-$env:TAG-win-x64.zip"

      - name: GitHub のリリースを作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG "dist/BomTool-$env:TAG-win-x64.zip" `
            --title "BomTool $env:TAG" `
            --notes-file .github/release-notes.md `
            --generate-notes
